[package]
name = "seadex-mobile"
version = "0.1.0"
description = "SeaDex for phones: the app's core, with a web UI (Tauri)"
edition = "2024"

[lib]
name = "seadex_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The core, without the desktop GUI.
seadex-downloader = { path = "../..", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
