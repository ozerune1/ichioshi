<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8fff"/>
      <stop offset="0.55" stop-color="#7f84ff"/>
      <stop offset="1" stop-color="#4f7dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe5ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f5cf0"/>
      <stop offset="1" stop-color="#5d4ee6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="224"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1460" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="960" height="960" fill="url(#bg)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#glow)"/>
    <!-- The play button, riding the sea. -->
    <path filter="url(#shadow)" fill="#ffffff"
      transform="translate(0 64)"
      d="M 392 236 C 392 196 434 172 469 192 L 760 360 C 795 380 795 430 760 450 L 469 618 C 434 638 392 614 392 574 Z"/>
    <!-- The sea: a wave that swallows the bottom of the tile. -->
    <path fill="url(#sea)"
      d="M 0 700 C 120 640 220 640 330 690 C 440 740 540 745 650 690 C 760 635 870 630 1024 690 L 1024 1024 L 0 1024 Z"/>
    <path fill="url(#deep)" opacity="0.9"
      d="M 0 820 C 130 770 240 772 350 812 C 470 856 580 856 690 810 C 800 765 900 762 1024 805 L 1024 1024 L 0 1024 Z"/>
  </g>
</svg>
