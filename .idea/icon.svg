<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ichioshi (イチオシ, "top pick"): the pick's star, with a play button cut out of it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8fff"/>
      <stop offset="0.55" stop-color="#7f84ff"/>
      <stop offset="1" stop-color="#4f7dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1460" flood-opacity="0.35"/>
    </filter>
    <!-- The play button, cut out of the star. -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <path fill="#000000" stroke="#000000" stroke-width="40" stroke-linejoin="round" d="M 610.0 546.6 L 472.0 626.3 L 472.0 467.0 Z"/>
    </mask>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="224"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="960" height="960" fill="url(#bg)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#glow)"/>
    <g filter="url(#shadow)">
      <path mask="url(#cut)" fill="#ffffff" stroke="#ffffff" stroke-width="64" stroke-linejoin="round"
        d="M 512.0 240.6 L 600.2 419.3 L 797.3 447.9 L 654.7 587.0 L 688.3 783.4 L 512.0 690.6 L 335.7 783.4 L 369.3 587.0 L 226.7 447.9 L 423.8 419.3 Z"/>
    </g>
  </g>
</svg>
