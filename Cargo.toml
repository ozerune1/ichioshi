[workspace]
# The phone app (Tauri): the core, with a web UI.
members = [".", "mobile/src-tauri"]

[package]
name = "ichioshi"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = "0.4"
dirs = "7"
fancy-regex = "0.20"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
# libass is loaded at run time (it draws text subtitles; without it they don't show).
libloading = "0.8"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls", "disable-upload"] }
librqbit-core = { version = "9.1", default-features = false, features = ["sha1-ring"] }
nzb-nntp = "=0.2.26"
nzb-rs = "=0.6.0"
par2-rs = "=0.13.1"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query", "form", "multipart"] }
ring = "0.17"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
# Binding the NAT-PMP socket to the VPN interface.
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
yenc-simd = "=0.1.1"
zip = { version = "9.8", default-features = false, features = ["chrono", "deflate-flate2"] }
# Unpacking the Linux update.
tar = { version = "0.4", default-features = false }
iced = { version = "0.14", features = ["image", "svg", "tokio", "advanced"], optional = true }
# Watch parties: their members find and reach each other (the video itself
# never goes this way; see `party`).
iroh = { version = "1.5", default-features = false, features = ["tls-ring", "portmapper"] }
# A watch party member seeding to the party: the router's port for it (UPnP,
# NAT-PMP or PCP; iroh brings it already).
portmapper = "0.20"
# Reading iroh's lookups (it brings it already).
n0-future = "0.3"

# The player (GStreamer) and file dialogs: not on Android, where videos open
# in a player app and paths are typed in.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.18", optional = true }
iced_video_player = { version = "0.6", optional = true }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }

# Android: started by the system (NativeActivity), through iced's patched
# runner; videos and links open in other apps (JNI).
[target.'cfg(target_os = "android")'.dependencies]
iced_winit = { version = "0.14", optional = true }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"], optional = true }
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

[features]
default = ["gui"]
# The desktop app (iced) and its player, and iced's Android port. The phone
# app (mobile/, Tauri) builds the core without it.
gui = [
    "dep:iced",
    "dep:rfd",
    "dep:iced_video_player",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:iced_winit",
    "dep:winit",
    "dep:jni",
    "dep:ndk-context",
]

[[bin]]
name = "ichioshi"
path = "src/main.rs"
required-features = ["gui"]

[dev-dependencies]
iced_test = "0.14"
rcgen = "0.14"
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = "0.26"

# Release builds without their symbol tables (the phone app's library is
# a third the size).
[profile.release]
strip = true

# Optimize dependencies even in debug builds: librqbit hashes every piece it
# downloads, and unoptimized SHA-1 would cap download speed.
[profile.dev.package."*"]
opt-level = 3

# iced's runner, patched to start on Android (vendor/iced_winit: see
# its src/lib.rs, `android`); the same everywhere else.
[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }
# Android: checks servers' certificates against the phone's CA folders (the
# crate's own Android verifier needs Java classes an APK without Gradle
# hasn't got). Unchanged elsewhere.
rustls-platform-verifier = { path = "vendor/rustls-platform-verifier" }
