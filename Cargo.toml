[package]
name = "seadex-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = "0.4"
dirs = "7"
# glow: the video player draws with OpenGL (mpv's render API).
eframe = { version = "0.37", features = ["persistence", "glow"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", features = ["http", "image"] }
fancy-regex = "0.20"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
# libmpv is loaded at run time: without it the app works, minus the player.
libloading = "0.8"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls", "disable-upload"] }
librqbit-core = { version = "9.1", default-features = false, features = ["sha1-ring"] }
nzb-nntp = "=0.2.26"
nzb-rs = "=0.6.0"
par2-rs = "=0.13.1"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query", "form", "multipart"] }
rfd = "0.18"
ring = "0.17"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Binding the NAT-PMP socket to the VPN interface.
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
yenc-simd = "=0.1.1"
zip = { version = "9.8", default-features = false, features = ["chrono"] }
# Keeping the screen on during playback (org.freedesktop.ScreenSaver).
zbus = "5"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }
egui_system_font_provider = "0.37"
# A headless OpenGL context for testing the player's video output.
khronos-egl = { version = "6", features = ["dynamic"] }
rcgen = "0.14"
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = "0.26"

# Optimize dependencies even in debug builds: librqbit hashes every piece it
# downloads, and unoptimized SHA-1 would cap download speed.
[profile.dev.package."*"]
opt-level = 3
